# Publishes a GitHub release, either when a version tag is pushed:
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# or from the Actions tab ("Run workflow"), which builds the chosen branch and creates the tag.
#
# The tag is the version (v1.2.0 -> disabilities-1.2.0+26.3.jar). Versions with a suffix, such as 1.3.0-beta.1,
# become pre-releases. Running the workflow again for a version replaces that release's jars.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 1.2.0 (creates the tag v1.2.0 on the chosen branch)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: read version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a version like 1.2.0 or 1.3.0-beta.1"
            exit 1
          fi
          minecraft="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "minecraft=$minecraft"
            echo "full=$version+$minecraft"
            if [[ "$version" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi
          } >> "$GITHUB_OUTPUT"
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      # Includes the unit tests and the server game tests.
      - name: build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew build -Pmod_version="$VERSION"
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          MINECRAFT: ${{ steps.version.outputs.minecraft }}
          FULL_VERSION: ${{ steps.version.outputs.full }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          files=("build/libs/disabilities-$FULL_VERSION.jar" "build/libs/disabilities-$FULL_VERSION-sources.jar")
          ls -l "${files[@]}"
          # Never attach jars built from one commit to a tag that points at another.
          # (On failure, e.g. a tag that doesn't exist yet, gh prints the error response instead of a SHA.)
          if tagged="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha 2> /dev/null)" && [[ "$tagged" != "$GITHUB_SHA" ]]; then
            echo "::error::$TAG already exists and points at $tagged, not at the commit that was built ($GITHUB_SHA)"
            exit 1
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            args=(
              --target "$GITHUB_SHA"
              --title "Disabilities $VERSION for Minecraft $MINECRAFT"
              --notes "Fabric mod for Minecraft $MINECRAFT. Needs Fabric Loader, Fabric API and Java 25, on the server and on every client."
              --generate-notes
            )
            if [[ "$PRERELEASE" == true ]]; then
              args+=(--prerelease)
            fi
            gh release create "$TAG" "${files[@]}" "${args[@]}"
          fi
